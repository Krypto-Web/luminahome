<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Home — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #F5A623; --gold-light: #FBBF4A;
      --green-dark: #071F12; --green-card: #122E1C;
      --text: #FFFFFF; --text-muted: rgba(255,255,255,0.5);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    html, body { min-height: 100%; background: var(--green-dark); font-family: var(--font-body); color: var(--text); overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(245,166,35,0.07) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 20px 40px; position: relative; z-index: 1; }
    .top-row { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 8px 0 24px; }
    .back-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text); font-family: var(--font-body); font-size: 14px; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; }
    .lang-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); font-family: var(--font-body); font-size: 13px; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .logo-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
    .logo-icon { width: 52px; height: 52px; background: var(--gold); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 24px; color: var(--green-dark); box-shadow: 0 0 28px rgba(245,166,35,0.22); }
    .logo-name { font-family: var(--font-display); font-size: 26px; color: var(--text); letter-spacing: 2px; }
    .logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 5px; margin-top: 3px; }
    .card { width: 100%; max-width: 400px; }
    .form-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
    .input-wrap { background: var(--green-card); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; display: flex; align-items: center; padding: 15px 18px; gap: 12px; transition: border-color 0.2s; }
    .input-wrap:focus-within { border-color: var(--gold); }
    .input-wrap svg { color: var(--gold); flex-shrink: 0; width: 18px; height: 18px; }
    .input-prefix { color: var(--text-muted); font-size: 15px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 12px; }
    .input-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 15px; flex: 1; min-width: 0; }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .captcha-code { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 5px 12px; font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: 4px; text-decoration: line-through; cursor: pointer; flex-shrink: 0; transition: opacity 0.15s; }
    .error-msg { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: #FF6B6B; font-size: 13px; padding: 12px 16px; border-radius: 12px; text-align: center; margin-bottom: 12px; display: none; }
    .error-msg.show { display: block; }
    .btn-gold { width: 100%; background: var(--gold); color: var(--green-dark); font-family: var(--font-body); font-weight: 700; font-size: 16px; border: none; border-radius: 14px; padding: 17px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(245,166,35,0.2); }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .signin-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .signin-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .terms { text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 16px; line-height: 1.6; }
  </style>
</head>
<body>
<div class="page">
  <div class="top-row">
    <a href="index.html" class="back-btn">← Back</a>
    <button class="lang-btn">🌐 English</button>
  </div>
  <div class="logo-wrap">
    <div class="logo-icon">L</div>
    <div><div class="logo-name">LUMINA</div><div class="logo-sub">HOME</div></div>
  </div>
  <div class="card">
    <div class="form-group">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.69 3.4 2 2 0 0 1 3.68 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6.08 6.08l1.07-1.07a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="input-prefix">+234</span>
        <input type="tel" id="phone" placeholder="Mobile number" autocomplete="tel">
      </div>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="Login password (min 6 characters)" autocomplete="new-password">
      </div>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <input type="text" id="captchaInput" placeholder="Enter captcha" maxlength="4">
        <div class="captcha-code" id="captchaDisplay" onclick="refreshCaptcha()">5239</div>
      </div>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <input type="text" id="inviteCode" placeholder="Invitation code (optional)" autocomplete="off">
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-gold" id="registerBtn" onclick="handleRegister()">Create account</button>
    <div class="signin-link">Already have an account? <a href="index.html">Sign in</a></div>
    <div class="terms">By creating an account you agree to our Terms of Service &amp; Privacy Policy</div>
  </div>
</div>
<script>
  const SUPABASE_URL = 'https://aedbdajfzozyhwozzjao.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Z7sn92vNhphRUHbjdHr4dQ_HOJ1S21i';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  const codes = ['5239','8471','3625','9182','7043','4816','2957'];
  let currentCode = '5239';
  function refreshCaptcha() {
    const el = document.getElementById('captchaDisplay');
    let next; do { next = codes[Math.floor(Math.random()*codes.length)]; } while(next===currentCode);
    currentCode = next; el.style.opacity='0';
    setTimeout(()=>{ el.textContent=next; el.style.opacity='1'; }, 150);
  }

  function generateInviteCode() {
    return 'LH' + Math.random().toString(36).substr(2,6).toUpperCase();
  }

  async function handleRegister() {
    const phone    = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value.trim();
    const captcha  = document.getElementById('captchaInput').value.trim();
    const invite   = document.getElementById('inviteCode').value.trim();
    const btn      = document.getElementById('registerBtn');

    document.getElementById('errorMsg').classList.remove('show');

    if (!phone || !password) { showError('Please fill in phone and password.'); return; }
    if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }
    if (captcha !== currentCode) { showError('Incorrect captcha. Try again.'); refreshCaptcha(); return; }

    btn.disabled = true; btn.textContent = 'Creating account…';

    const email = phone.replace(/\s+/g,'') + '@luminahome.app';
    const { data, error } = await sb.auth.signUp({ email, password });

    if (error) {
      showError(error.message.includes('already') ? 'This phone number is already registered.' : error.message);
      btn.disabled = false; btn.textContent = 'Create account'; return;
    }

    const uid = data.user.id;
    const myCode = generateInviteCode();

    // Create profile
    await sb.from('profiles').insert({ id: uid, phone: phone.replace(/\s+/g,''), invite_code: myCode, referred_by: invite || null });

    // Create wallet
    await sb.from('wallets').insert({ id: uid, balance: 0, total_earnings: 0, total_withdrawn: 0, referral_earnings: 0 });

    window.location.href = 'dashboard.html';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.classList.add('show');
  }
</script>
</body>
</html>
