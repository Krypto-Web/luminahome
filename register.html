<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Home — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F5A623;
      --gold-light: #FBBF4A;
      --green-dark: #071F12;
      --green-deep: #0A2A1A;
      --green-mid: #0F3D25;
      --green-card: #122E1C;
      --text: #FFFFFF;
      --text-muted: rgba(255,255,255,0.5);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    html, body {
      min-height: 100%;
      background: var(--green-dark);
      font-family: var(--font-body);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245,166,35,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 20px 40px;
      position: relative;
      z-index: 1;
    }

    /* Top nav row */
    .top-row {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 24px;
      animation: fadeUp 0.4s ease both;
    }

    .back-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover { border-color: rgba(255,255,255,0.25); }

    .lang-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .lang-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Logo */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
      animation: fadeUp 0.5s ease 0.05s both;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: var(--gold);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 24px;
      color: var(--green-dark);
      box-shadow: 0 0 28px rgba(245,166,35,0.22);
    }

    .logo-name {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--text);
      letter-spacing: 2px;
      line-height: 1;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 5px;
      margin-top: 3px;
    }

    /* Card / form */
    .card {
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .input-wrap {
      background: var(--green-card);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 15px 18px;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--gold); }

    .input-wrap svg {
      color: var(--gold);
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .input-prefix {
      color: var(--text-muted);
      font-size: 15px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.1);
      padding-right: 12px;
    }

    .input-wrap input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      flex: 1;
      min-width: 0;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }

    /* Captcha row */
    .captcha-input { flex: 1; }
    .captcha-code {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-decoration: line-through;
      user-select: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .captcha-code:hover { background: rgba(255,255,255,0.12); }

    .btn-gold {
      width: 100%;
      background: var(--gold);
      color: var(--green-dark);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      padding: 17px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(245,166,35,0.2);
    }
    .btn-gold:hover {
      background: var(--gold-light);
      box-shadow: 0 6px 28px rgba(245,166,35,0.35);
      transform: translateY(-1px);
    }
    .btn-gold:active { transform: translateY(0); }

    .signin-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .signin-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    .signin-link a:hover { text-decoration: underline; }

    /* Terms note */
    .terms {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-top: 16px;
      line-height: 1.6;
    }
    .terms a { color: rgba(245,166,35,0.6); text-decoration: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="top-row">
    <a href="index.html" class="back-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back
    </a>
    <button class="lang-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      English
    </button>
  </div>

  <div class="logo-wrap">
    <div class="logo-row">
      <div class="logo-icon">L</div>
      <div>
        <div class="logo-name">LUMINA</div>
        <div class="logo-sub">HOME</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">

      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.69 3.4 2 2 0 0 1 3.68 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6.08 6.08l1.07-1.07a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="input-prefix">+234</span>
        <input type="tel" placeholder="Mobile number" autocomplete="tel">
      </div>

      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" placeholder="Login password (min 6 characters)" autocomplete="new-password">
      </div>

      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <input type="text" placeholder="Enter captcha" class="captcha-input" maxlength="4">
        <div class="captcha-code" id="captcha" onclick="refreshCaptcha()" title="Click to refresh">5239</div>
      </div>

      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        <input type="text" placeholder="Invitation code (optional)" autocomplete="off">
      </div>

    </div>

    <button class="btn-gold" onclick="window.location.href='dashboard.html'">Create account</button>

    <div class="signin-link">
      Already have an account? <a href="index.html">Sign in</a>
    </div>

    <div class="terms">
      By creating an account you agree to our<br>
      <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
    </div>
  </div>

</div>

<script>
  const codes = ['5239','8471','3625','9182','7043','4816','2957'];
  function refreshCaptcha() {
    const el = document.getElementById('captcha');
    const current = el.textContent;
    let next;
    do { next = codes[Math.floor(Math.random() * codes.length)]; } while (next === current);
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = next; el.style.opacity = '1'; }, 150);
  }
  document.getElementById('captcha').style.transition = 'opacity 0.15s';
</script>

</body>
</html>
