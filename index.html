<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Home — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #F5A623; --gold-light: #FBBF4A;
      --green-dark: #071F12; --green-card: #122E1C;
      --text: #FFFFFF; --text-muted: rgba(255,255,255,0.5);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }
    html, body { height: 100%; background: var(--green-dark); font-family: var(--font-body); color: var(--text); overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -20%; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; position: relative; z-index: 1; }
    .lang-btn { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); font-family: var(--font-body); font-size: 13px; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
    .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; animation: fadeUp 0.6s ease both; }
    .logo-row { display: flex; align-items: center; gap: 14px; }
    .logo-icon { width: 60px; height: 60px; background: var(--gold); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 28px; color: var(--green-dark); box-shadow: 0 0 32px rgba(245,166,35,0.25); }
    .logo-name { font-family: var(--font-display); font-size: 30px; color: var(--text); letter-spacing: 2px; }
    .logo-sub { font-size: 11px; color: var(--text-muted); letter-spacing: 5px; margin-top: 3px; }
    .card { width: 100%; max-width: 400px; animation: fadeUp 0.7s ease 0.1s both; }
    .form-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
    .input-wrap { background: var(--green-card); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; display: flex; align-items: center; padding: 15px 18px; gap: 12px; transition: border-color 0.2s; }
    .input-wrap:focus-within { border-color: var(--gold); }
    .input-wrap svg { color: var(--gold); flex-shrink: 0; width: 18px; height: 18px; }
    .input-prefix { color: var(--text-muted); font-size: 15px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 12px; }
    .input-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: var(--font-body); font-size: 15px; flex: 1; min-width: 0; }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .error-msg { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: #FF6B6B; font-size: 13px; padding: 12px 16px; border-radius: 12px; text-align: center; margin-bottom: 12px; display: none; }
    .error-msg.show { display: block; }
    .btn-gold { width: 100%; background: var(--gold); color: var(--green-dark); font-family: var(--font-body); font-weight: 700; font-size: 16px; border: none; border-radius: 14px; padding: 17px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 20px rgba(245,166,35,0.2); }
    .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
    .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .register-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
    .register-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .footer { position: absolute; bottom: 20px; font-size: 12px; color: var(--text-muted); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="page">
  <button class="lang-btn">🌐 English</button>
  <div class="logo-wrap">
    <div class="logo-row">
      <div class="logo-icon">L</div>
      <div><div class="logo-name">LUMINA</div><div class="logo-sub">HOME</div></div>
    </div>
  </div>
  <div class="card">
    <div class="form-group">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.69 3.4 2 2 0 0 1 3.68 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6.08 6.08l1.07-1.07a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="input-prefix">+234</span>
        <input type="tel" id="phone" placeholder="Please enter mobile number" autocomplete="tel">
      </div>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="Please enter the login password" autocomplete="current-password">
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-gold" id="loginBtn" onclick="handleLogin()">Sign in</button>
    <div class="register-link">Don't have an account? <a href="register.html">Register now</a></div>
  </div>
  <div class="footer">LUMINA HOME &copy; 2026</div>
</div>
<script>
  const SUPABASE_URL = 'https://aedbdajfzozyhwozzjao.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Z7sn92vNhphRUHbjdHr4dQ_HOJ1S21i';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  async function handleLogin() {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');
    document.getElementById('errorMsg').classList.remove('show');
    if (!phone || !password) { showError('Please fill in all fields.'); return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    const email = phone.replace(/\s+/g, '') + '@luminahome.app';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showError('Incorrect phone number or password.');
      btn.disabled = false; btn.textContent = 'Sign in';
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.classList.add('show');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
