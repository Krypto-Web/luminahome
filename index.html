<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Home — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F5A623;
      --gold-light: #FBBF4A;
      --green-dark: #071F12;
      --green-deep: #0A2A1A;
      --green-mid: #0F3D25;
      --green-card: #122E1C;
      --text: #FFFFFF;
      --text-muted: rgba(255,255,255,0.5);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--green-dark);
      font-family: var(--font-body);
      color: var(--text);
      overflow-x: hidden;
    }

    /* Subtle radial glow background */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
      z-index: 1;
    }

    .lang-bar {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .lang-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .lang-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Logo */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
      animation: fadeUp 0.6s ease both;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: var(--gold);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--green-dark);
      box-shadow: 0 0 32px rgba(245,166,35,0.25);
    }

    .logo-text-wrap {
      display: flex;
      flex-direction: column;
    }

    .logo-name {
      font-family: var(--font-display);
      font-size: 30px;
      color: var(--text);
      line-height: 1;
      letter-spacing: 2px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 5px;
      margin-top: 3px;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.7s ease 0.1s both;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .input-wrap {
      background: var(--green-card);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 15px 18px;
      gap: 12px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within {
      border-color: var(--gold);
    }

    .input-wrap svg {
      color: var(--gold);
      flex-shrink: 0;
      width: 18px;
      height: 18px;
    }

    .input-prefix {
      color: var(--text-muted);
      font-size: 15px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.1);
      padding-right: 12px;
    }

    .input-wrap input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      flex: 1;
      min-width: 0;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }

    .btn-gold {
      width: 100%;
      background: var(--gold);
      color: var(--green-dark);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 14px;
      padding: 17px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(245,166,35,0.2);
    }
    .btn-gold:hover {
      background: var(--gold-light);
      box-shadow: 0 6px 28px rgba(245,166,35,0.35);
      transform: translateY(-1px);
    }
    .btn-gold:active { transform: translateY(0); }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .register-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }
    .register-link a:hover { text-decoration: underline; }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Decorative dots */
    .dots {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .dots::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 200px;
      border-radius: 50%;
      border: 1px solid rgba(245,166,35,0.06);
      box-shadow: 0 0 0 30px rgba(245,166,35,0.03), 0 0 0 60px rgba(245,166,35,0.02);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="dots"></div>

<div class="page">

  <button class="lang-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    English
  </button>

  <div class="logo-wrap">
    <div class="logo-row">
      <div class="logo-icon">L</div>
      <div class="logo-text-wrap">
        <div class="logo-name">LUMINA</div>
        <div class="logo-sub">HOME</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">

      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.69 3.4 2 2 0 0 1 3.68 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6.08 6.08l1.07-1.07a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span class="input-prefix">+234</span>
        <input type="tel" placeholder="Please enter mobile number" autocomplete="tel">
      </div>

      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" placeholder="Please enter the login password" autocomplete="current-password">
      </div>

    </div>

    <button class="btn-gold" onclick="window.location.href='dashboard.html'">Sign in</button>

    <div class="register-link">
      Don't have an account? <a href="register.html">Register now</a>
    </div>
  </div>

  <div class="footer">LUMINA HOME &copy; 2026</div>

</div>

</body>
</html>
