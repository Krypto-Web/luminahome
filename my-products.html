<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Home — My Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #F5A623;
      --gold-light: #FBBF4A;
      --gold-dim: rgba(245,166,35,0.15);
      --green-dark: #071F12;
      --green-deep: #0A2A1A;
      --green-mid: #0F3D25;
      --green-card: #122E1C;
      --green-nav: #0C2E1A;
      --text: #FFFFFF;
      --text-muted: rgba(255,255,255,0.5);
      --text-faint: rgba(255,255,255,0.25);
      --success: #4CD99A;
      --blue: #5BADF5;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --nav-h: 68px;
    }

    html, body {
      min-height: 100%;
      background: var(--green-dark);
      font-family: var(--font-body);
      color: var(--text);
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--nav-h);
    }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 10px;
      position: sticky; top: 0;
      background: var(--green-dark);
      z-index: 5;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .top-logo { display: flex; align-items: center; gap: 10px; }
    .top-icon {
      width: 34px; height: 34px;
      background: var(--gold); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display); font-size: 16px; color: var(--green-dark);
    }
    .top-name { font-family: var(--font-display); font-size: 17px; color: var(--text); letter-spacing: 1px; }
    .top-sub  { font-size: 9px; color: var(--text-muted); letter-spacing: 3px; }
    .lang-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted); font-family: var(--font-body);
      font-size: 12px; padding: 5px 12px; border-radius: 20px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
    }

    /* ── PAGE TITLE ── */
    .page-header { padding: 20px 20px 0; }
    .page-title {
      font-family: var(--font-display);
      font-size: 24px; color: var(--text); margin-bottom: 4px;
    }
    .page-sub { font-size: 13px; color: var(--text-muted); }

    /* ── STATS GRID ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 16px 0;
    }
    .stat-card {
      background: var(--green-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px;
    }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-value.gold    { color: var(--gold); }
    .stat-value.green   { color: var(--success); }
    .stat-value.blue    { color: var(--blue); }
    .stat-value.white   { color: var(--text); }

    /* ── FILTER TABS ── */
    .filter-tabs {
      display: flex; gap: 8px;
      padding: 16px 16px 0;
    }
    .tab {
      flex: 1; text-align: center;
      padding: 10px 8px;
      border-radius: 12px;
      font-family: var(--font-body);
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: none;
      transition: all 0.2s;
    }
    .tab.active { background: var(--gold); color: var(--green-dark); }
    .tab.inactive {
      background: var(--green-card);
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .tab.inactive:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 13px; font-weight: 600;
      color: var(--text-muted);
      padding: 18px 16px 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── PLAN CARD ── */
    .plan-card {
      margin: 0 16px 14px;
      background: var(--green-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
    }

    .plan-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      gap: 10px;
    }
    .plan-icon {
      width: 42px; height: 42px;
      background: var(--gold-dim);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .plan-icon svg { color: var(--gold); width: 22px; height: 22px; }
    .plan-info { flex: 1; }
    .plan-name { font-size: 16px; font-weight: 700; color: var(--text); }
    .plan-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .badge {
      font-size: 12px; font-weight: 700;
      padding: 5px 14px; border-radius: 20px;
      flex-shrink: 0;
    }
    .badge.active {
      background: rgba(76,217,154,0.12);
      color: var(--success);
      border: 1px solid rgba(76,217,154,0.25);
    }
    .badge.completed {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(245,166,35,0.25);
    }

    .plan-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .plan-stat { text-align: center; }
    .plan-stat-label {
      font-size: 10px; color: var(--text-muted);
      letter-spacing: 0.5px; text-transform: uppercase;
      margin-bottom: 5px;
    }
    .plan-stat-value { font-size: 16px; font-weight: 700; }
    .plan-stat-value.gold  { color: var(--gold); }
    .plan-stat-value.green { color: var(--success); }
    .plan-stat-value.white { color: var(--text); }

    .plan-footer { padding: 14px 18px; }
    .progress-row {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 8px;
    }
    .progress-pct { font-size: 12px; color: var(--text-muted); }
    .days-left { font-size: 12px; font-weight: 600; color: var(--gold); }
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px; overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--gold), var(--success));
      transition: width 1s ease;
    }
    .expiry-row {
      display: flex; align-items: center; gap: 6px;
    }
    .expiry-row svg { color: var(--text-muted); width: 14px; height: 14px; }
    .expiry-text { font-size: 12px; color: var(--text-muted); }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 50px 30px;
      display: none;
    }
    .empty-state svg { color: rgba(255,255,255,0.12); width: 56px; height: 56px; margin-bottom: 14px; }
    .empty-title { font-size: 17px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; color: var(--text-faint); line-height: 1.6; }
    .empty-state.show { display: block; }

    /* ── CTA ── */
    .cta-wrap { padding: 4px 16px 0; }
    .btn-gold {
      width: 100%;
      background: var(--gold); color: var(--green-dark);
      font-family: var(--font-body); font-weight: 700; font-size: 15px;
      border: none; border-radius: 14px; padding: 16px;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(245,166,35,0.2);
    }
    .btn-gold:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(245,166,35,0.3);
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--green-nav);
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex; justify-content: space-around; align-items: center;
      padding: 0 8px; z-index: 10;
    }
    .nav-item {
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      color: var(--text-muted); font-size: 11px;
      background: none; border: none; cursor: pointer;
      padding: 8px 12px; border-radius: 12px;
      text-decoration: none; transition: color 0.2s;
      min-width: 56px;
    }
    .nav-item svg { width: 22px; height: 22px; }
    .nav-item.active { color: var(--gold); }
    .nav-item:hover { color: var(--text); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-logo">
      <div class="top-icon">L</div>
      <div>
        <div class="top-name">LUMINA</div>
        <div class="top-sub">HOME</div>
      </div>
    </div>
    <button class="lang-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      English
    </button>
  </div>

  <!-- Page Header -->
  <div class="page-header">
    <div class="page-title">My Products</div>
    <div class="page-sub">Track your active investment plans</div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Invested</div>
      <div class="stat-value gold" id="totalInvested">₦9,500</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Daily Income</div>
      <div class="stat-value green" id="dailyIncome">₦1,900</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Profit</div>
      <div class="stat-value blue" id="totalProfit">₦23,400</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Plans</div>
      <div class="stat-value white" id="activePlans">2</div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="filter-tabs">
    <button class="tab active" onclick="filterPlans('active', this)">Active</button>
    <button class="tab inactive" onclick="filterPlans('completed', this)">Completed</button>
    <button class="tab inactive" onclick="filterPlans('all', this)">All</button>
  </div>

  <div class="section-label" id="sectionLabel">Your active plans</div>

  <!-- Plans rendered by JS -->
  <div id="plansList"></div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
    <div class="empty-title">No plans here yet</div>
    <div class="empty-sub">You don't have any plans in this category.<br>Browse our investment products to get started.</div>
  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="btn-gold" onclick="window.location.href='products.html'">
      Browse investment plans →
    </button>
  </div>

  <div style="height: 20px;"></div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Home
  </a>
  <a href="products.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
    Product
  </a>
  <a href="withdraw.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    Withdraw
  </a>
  <a href="gift.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
    Gift
  </a>
  <a href="profile.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Me
  </a>
</nav>

<script>
  const plans = [
    {
      name: 'LUMINA VIP 2',
      status: 'active',
      started: 'May 10, 2026',
      expires: 'Jun 30, 2026',
      amount: '₦7,000',
      daily: '₦1,300',
      earned: '₦0',
      pct: 0,
      daysLeft: 51
    },
    {
      name: 'LUMINA VIP 1',
      status: 'active',
      started: 'Apr 01, 2026',
      expires: 'May 21, 2026',
      amount: '₦2,500',
      daily: '₦600',
      earned: '₦23,400',
      pct: 78,
      daysLeft: 11
    },
    {
      name: 'LUMINA VIP 1',
      status: 'completed',
      started: 'Feb 01, 2026',
      expires: 'Mar 22, 2026',
      amount: '₦2,500',
      daily: '₦600',
      earned: '₦30,000',
      pct: 100,
      daysLeft: 0
    }
  ];

  function buildCard(p, delay) {
    const isCompleted = p.status === 'completed';
    return `
      <div class="plan-card" style="animation-delay:${delay}ms">
        <div class="plan-header">
          <div class="plan-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          </div>
          <div class="plan-info">
            <div class="plan-name">${p.name}</div>
            <div class="plan-date">Started: ${p.started}</div>
          </div>
          <div class="badge ${p.status}">${isCompleted ? 'Completed' : 'Active'}</div>
        </div>
        <div class="plan-stats">
          <div class="plan-stat">
            <div class="plan-stat-label">Amount</div>
            <div class="plan-stat-value white">${p.amount}</div>
          </div>
          <div class="plan-stat">
            <div class="plan-stat-label">Daily</div>
            <div class="plan-stat-value green">${p.daily}</div>
          </div>
          <div class="plan-stat">
            <div class="plan-stat-label">Earned</div>
            <div class="plan-stat-value gold">${p.earned}</div>
          </div>
        </div>
        <div class="plan-footer">
          <div class="progress-row">
            <span class="progress-pct">${p.pct}% complete</span>
            <span class="days-left">${isCompleted ? 'Completed ✓' : p.daysLeft + ' days left'}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${p.pct}%"></div>
          </div>
          <div class="expiry-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="expiry-text">${isCompleted ? 'Expired' : 'Expires'}: ${p.expires}</span>
          </div>
        </div>
      </div>`;
  }

  function filterPlans(filter, btn) {
    // Update tabs
    document.querySelectorAll('.tab').forEach(t => { t.className = 'tab inactive'; });
    btn.className = 'tab active';

    // Update label
    const labels = { active: 'Your active plans', completed: 'Completed plans', all: 'All plans' };
    document.getElementById('sectionLabel').textContent = labels[filter];

    // Filter and render
    const filtered = filter === 'all' ? plans : plans.filter(p => p.status === filter);
    const list = document.getElementById('plansList');
    const empty = document.getElementById('emptyState');

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.classList.add('show');
    } else {
      empty.classList.remove('show');
      list.innerHTML = filtered.map((p, i) => buildCard(p, i * 80)).join('');
    }
  }

  // Initial render
  filterPlans('active', document.querySelector('.tab.active'));
</script>

</body>
</html>
